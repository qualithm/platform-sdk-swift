# Generated by dx/scripts/ci-sync from ci-templates/swift-lib.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# One toolchain: the Linux jobs run in the swift
# image of SWIFT_VERSION, and the macOS job selects Xcode XCODE_VERSION, which
# ships the same Swift. dx config check holds every Swift template to both.
env:
  SWIFT_VERSION: "6.4.0"
  XCODE_VERSION: "27.0"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!LICENSE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    # The container runs steps under sh, and its root user doesn't own the
    # runner's checkout, so git refuses it. bash and safe.directory make the
    # steps behave as they do on a runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trust the checkout
        if: github.run_id != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # swift-format ships with the toolchain, so its version is the pinned
      # Swift's. The config is .swift-format.
      # Tracked files only, so build output and checkouts are never linted.
      - run: git ls-files -z '*.swift' | xargs -0 swift format lint --strict

  coverage:
    name: Build, Test & Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux, not macOS: the package builds on Linux, and a macOS minute bills at
    # about ten Linux minutes on a private repo.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    # The container runs steps under sh, and its root user doesn't own the
    # runner's checkout, so git refuses it. bash and safe.directory make the
    # steps behave as they do on a runner.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trust the checkout
        if: github.run_id != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # PRs restore but never save: a PR-run cache is scoped to its merge ref,
      # which no other branch can read.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .build
          key:
            swiftpm-linux-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved',
            'Package.swift') }}
          restore-keys: swiftpm-linux-${{ env.SWIFT_VERSION }}-
      - run: swift build
      - name: Test with coverage
        run: |
          set -euo pipefail
          swift test --enable-code-coverage
          profdata="$(dirname "$(swift test --show-codecov-path)")/default.profdata"
          bin="$(swift build --show-bin-path)"
          # The test binary: an .xctest bundle on macOS, a *Tests.so on Linux.
          objects=()
          for tests in "$bin"/*.xctest "$bin"/*Tests.so; do
            [ -e "$tests" ] || continue
            if [ -d "$tests/Contents/MacOS" ]; then
              tests="$tests/Contents/MacOS/$(basename "$tests" .xctest)"
            fi
            objects+=(-object "$tests")
          done
          if command -v llvm-cov >/dev/null; then cov=(llvm-cov); else cov=(xcrun llvm-cov); fi
          # Tests, examples and a generated client's Generated/ sources (checked by
          # Generated Drift) are not the gated layer.
          "${cov[@]}" export -format=lcov -instr-profile "$profdata" "${objects[@]}" \
            -ignore-filename-regex='/(\.build|Tests|examples|Generated)/' > lcov.info
      - name: Enforce coverage threshold (>=80%)
        run: |
          awk '/^LF:/ {lf+=substr($0,4)} /^LH:/ {lh+=substr($0,4)} END {
            if (lf == 0) { print "No LF records in lcov.info"; exit 1 }
            pct = (lh / lf) * 100
            printf "Line coverage: %.2f%% (%d/%d)\n", pct, lh, lf
            if (pct + 0 < 80) { print "Coverage below 80% threshold"; exit 1 }
          }' lcov.info
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: .build
          key:
            swiftpm-linux-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved',
            'Package.swift') }}

  macos:
    name: Build & Test (macOS)
    needs: changes
    # The main hop only: Linux covers every PR, and this catches Apple-only API
    # use before a release at a tenth of the cost of running it on every PR.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    # GitHub's macOS 27 image with Xcode 27 (a preview image as of 2026-10).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check the toolchain
        run: |
          xcodebuild -version
          swift --version 2>&1 | tee /dev/stderr | grep -q "swiftlang-${SWIFT_VERSION}\." \
            || { echo "::error::Xcode ${XCODE_VERSION} does not ship Swift ${SWIFT_VERSION}"; exit 1; }
      - run: swift build
      - run: swift test

  # dx:generated-drift-begin
  generated-drift:
    name: Generated Drift
    # A generated client commits its generator's output. Rerunning the pinned
    # generator on the committed spec must reproduce it exactly, so a hand edit
    # can't pass as a generator change.
    # Ungated by `changes`: the generator pin and config live outside the code
    # filter. A repo without openapi-generator.yaml generates nothing and skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Regenerate and fail on any difference
        run: |
          if [ ! -f openapi-generator.yaml ]; then
            echo "no openapi-generator.yaml: not a generated client; skipping"
            exit 0
          fi
          scripts/generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code differs from what scripts/generate writes. Run scripts/generate and commit the result; never edit generated files by hand."
            git status --short
            git diff --stat
            exit 1
          fi
  # dx:generated-drift-end
  docs:
    name: Docs
    needs: changes
    # Full tier: the API docs build only on the main hop, where a release is
    # cut from. DocC builds each library target from its symbol graph
    # and fails on any warning, such as a parameter the comment names wrongly.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Trust the checkout
        if: github.run_id != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the API docs (DocC)
        run: |
          set -euo pipefail
          graphs="$RUNNER_TEMP/symbol-graphs"
          mkdir -p "$graphs" "$RUNNER_TEMP/docs"
          swift build -Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc "$graphs"
          # Every directory under Sources/ is a library target; examples and
          # tests live elsewhere. Each target's docs use only its own graphs.
          for dir in Sources/*/; do
            target=$(basename "$dir")
            own="$RUNNER_TEMP/graphs-$target"
            mkdir -p "$own"
            cp "$graphs/$target".symbols.json "$graphs/$target"@*.symbols.json "$own/" 2>/dev/null || true
            catalog=()
            for docc in "$dir"*.docc; do
              if [[ -d "$docc" ]]; then catalog=("$docc"); fi
            done
            docc convert "${catalog[@]}" --additional-symbol-graph-dir "$own" \
              --fallback-display-name "$target" --fallback-bundle-identifier "$target" \
              --output-dir "$RUNNER_TEMP/docs/$target" --warnings-as-errors
          done

  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry.
    # Runs on every PR, docs included: a README can carry an image reference
    # too. A repo with no vendored registry references no container image and
    # skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, lint, coverage, macos, generated-drift, docs, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
