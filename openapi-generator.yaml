# Generator options for scripts/generate. The generator version is the image
# pinned in scripts/generate.
generatorName: swift6
inputSpec: /local/openapi.json
outputDir: /local/.generated
additionalProperties:
  projectName: QualithmPlatform
  useSPMFileStructure: true
  responseAs: AsyncAwait
  hashableModels: true
  enumUnknownDefaultCase: true
